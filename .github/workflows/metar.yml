name: METAR/TAF de secours
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_metar.py
      - run: |
          git config user.name "meteovol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metar_fr.json
          git diff --cached --quiet || (git commit -m "METAR/TAF $(date -u +%H:%M)" && git push)
