name: Exploration 3D (temporaire)
on:
  push:
    branches: [explore3d]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 explore/probe.py
      - run: |
          git config user.name "meteovol-bot"; git config user.email "actions@users.noreply.github.com"
          git add -f explore/out && git commit -qm "résultats" && git push
