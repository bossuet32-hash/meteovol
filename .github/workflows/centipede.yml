name: Bases Centipède
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths: ["tools/fetch_centipede.py", ".github/workflows/centipede.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_centipede.py
      - run: |
          git config user.name "meteovol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/centipede.json
          git diff --cached --quiet || (git commit -m "Bases Centipède $(date -u +%d/%m\ %H:%M)" && git pull --rebase -q && git push)
