name: NOTAM (FAA NMS)
on:
  schedule:
    - cron: "47 * * * *"
  push:
    paths: ["tools/fetch_notam.py", ".github/workflows/notam.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_notam.py
        env:
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
          NMS_ENV: staging
      - run: |
          [ -f data/notam_fr.json ] || exit 0
          git config user.name "meteovol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/notam_fr.json
          git diff --cached --quiet || (git commit -m "NOTAM $(date -u +%d/%m\ %H:%M)" && git pull --rebase -q && git push)
